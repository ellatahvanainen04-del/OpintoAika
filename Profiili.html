<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profiili ja asetukset - OpintoAika</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&family=Epilogue:wght@600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app-theme.css" data-app-theme>
  <script src="app-theme.js"></script>
  <style>
    body { min-height: 100vh; margin: 0; font-family: Arimo, sans-serif; color: #20312f; background: #f7f9f6; }
    .profile-header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 0 20px; background: rgba(255,255,255,.94); border-bottom: 1px solid #dfe6e2; }
    .profile-brand { color: inherit; font-family: Epilogue, sans-serif; font-weight: 700; text-decoration: none; }
    .profile-back { display: inline-flex; align-items: center; gap: 6px; color: #506c62; font-size: 13px; font-weight: 700; text-decoration: none; }
    .profile-page { width: min(100% - 32px, 720px); margin: 36px auto 72px; }
    .profile-page h1 { margin: 0 0 8px; font: 700 26px/1.2 Epilogue, sans-serif; }
    .profile-intro { margin: 0 0 24px; color: #657370; font-size: 14px; }
    .profile-section { padding: 20px 0; border-top: 1px solid #dfe6e2; }
    .profile-section h2 { margin: 0 0 6px; font: 700 17px/1.3 Epilogue, sans-serif; }
    .profile-muted { margin: 0 0 16px; color: #657370; font-size: 13px; }
    .profile-form { display: grid; gap: 12px; max-width: 480px; }
    .profile-field { display: flex; flex-direction: column; gap: 5px; color: #34453e; font-size: 12px; font-weight: 700; }
    .profile-input { box-sizing: border-box; width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid #cbd7c7; color: #20312f; background: #fff; font: 14px Arimo, sans-serif; }
    .profile-form-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .photo-row { display: flex; align-items: center; gap: 18px; }
    .profile-avatar { display: grid; place-items: center; width: 104px; height: 104px; flex: 0 0 104px; overflow: hidden; border-radius: 50%; color: #fff; background: #668259; }
    .profile-avatar-icon { font-size: 44px; }
    .photo-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .profile-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 0 14px; border: 1px solid #cbd7c7; color: #20312f; background: #fff; font: 700 13px Arimo, sans-serif; text-decoration: none; cursor: pointer; }
    .profile-button.primary { color: #fff; border-color: #506c62; background: #506c62; }
    .profile-button.danger { color: #a12b32; }
    .profile-button[hidden] { display: none; }
    .photo-input { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; clip-path: inset(50%); }
    .photo-status { min-height: 18px; margin: 10px 0 0; color: #657370; font-size: 12px; }
    .theme-options { display: inline-flex; padding: 3px; gap: 3px; border: 1px solid #dfe6e2; background: #edf1ed; }
    .theme-option { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 14px; border: 0; color: #50605a; background: transparent; font: 700 13px Arimo, sans-serif; cursor: pointer; }
    .theme-option[aria-checked="true"] { color: #fff; background: #506c62; }
    .logout-row { margin-top: 16px; padding-top: 22px; border-top: 1px solid #dfe6e2; }
    @media (max-width: 480px) {
      .profile-header { padding: 0 14px; }
      .profile-page { width: calc(100% - 28px); margin-top: 26px; }
      .photo-row { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="profile-header">
    <a class="profile-brand" href="Lukujärjestys.html">OpintoAika</a>
    <a class="profile-back" href="Lukujärjestys.html"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>Takaisin aikatauluun</a>
  </header>
  <main class="profile-page">
    <h1>Profiili ja asetukset</h1>
    <p class="profile-intro">Hallitse profiilikuvaa ja ulkoasua.</p>

    <section class="profile-section" aria-labelledby="personal-details-heading">
      <h2 id="personal-details-heading">Henkilötiedot</h2>
      <p class="profile-muted">Tallennetaan vain tähän selaimeen.</p>
      <form id="profile-details-form" class="profile-form">
        <label class="profile-field" for="profile-name">Nimi
          <input class="profile-input" id="profile-name" name="name" type="text" autocomplete="name">
        </label>
        <label class="profile-field" for="profile-birth-date">Syntymäaika
          <input class="profile-input" id="profile-birth-date" name="birthDate" type="date" autocomplete="bday">
        </label>
        <label class="profile-field" for="profile-email">Sähköposti
          <input class="profile-input" id="profile-email" name="email" type="email" autocomplete="email">
        </label>
        <label class="profile-field" for="profile-phone">Puhelinnumero
          <input class="profile-input" id="profile-phone" name="phone" type="tel" autocomplete="tel">
        </label>
        <div class="profile-form-actions">
          <button class="profile-button primary" type="submit"><span class="material-symbols-outlined" aria-hidden="true">save</span>Tallenna tiedot</button>
          <p id="profile-details-status" class="photo-status" aria-live="polite"></p>
        </div>
      </form>
    </section>

    <section class="profile-section" aria-labelledby="profile-photo-heading">
      <h2 id="profile-photo-heading">Profiilikuva</h2>
      <p class="profile-muted">Valitse kuva tältä laitteelta.</p>
      <div class="photo-row">
        <div id="profile-avatar" class="profile-avatar" data-profile-photo-target data-photo-alt="Profiilikuva" data-fallback-class="profile-avatar-icon" aria-label="Profiilikuva"><span class="material-symbols-outlined profile-avatar-icon" aria-hidden="true">person</span></div>
        <div>
          <div class="photo-actions">
            <label class="profile-button primary" for="profile-photo-input"><span class="material-symbols-outlined" aria-hidden="true">upload</span>Lisää kuva</label>
            <input class="photo-input" id="profile-photo-input" type="file" accept="image/*" aria-label="Valitse profiilikuva">
            <button class="profile-button danger" id="remove-profile-photo" type="button" hidden><span class="material-symbols-outlined" aria-hidden="true">delete</span>Poista kuva</button>
          </div>
          <p id="photo-status" class="photo-status" aria-live="polite"></p>
        </div>
      </div>
    </section>

    <section class="profile-section" aria-labelledby="appearance-heading">
      <h2 id="appearance-heading">Ulkoasu</h2>
      <p class="profile-muted">Valitse sovelluksen teema.</p>
      <div class="theme-options" role="radiogroup" aria-label="Teema">
        <button class="theme-option" type="button" role="radio" data-theme-option="light" aria-checked="true"><span class="material-symbols-outlined" aria-hidden="true">light_mode</span>Vaalea</button>
        <button class="theme-option" type="button" role="radio" data-theme-option="dark" aria-checked="false"><span class="material-symbols-outlined" aria-hidden="true">dark_mode</span>Tumma</button>
      </div>
    </section>

    <div class="logout-row">
      <a class="profile-button danger" id="logout-link" href="Kirjautumissivu/Kirjaudu.html"><span class="material-symbols-outlined" aria-hidden="true">logout</span>Kirjaudu ulos</a>
    </div>
  </main>
  <script>
    (() => {
      const profileForm = document.getElementById('profile-details-form');
      const detailsStatus = document.getElementById('profile-details-status');
      const profileFields = {
        name: document.getElementById('profile-name'),
        birthDate: document.getElementById('profile-birth-date'),
        email: document.getElementById('profile-email'),
        phone: document.getElementById('profile-phone')
      };
      try {
        const savedProfile = JSON.parse(localStorage.getItem('opintoaikaProfile') || 'null');
        if (savedProfile) Object.entries(profileFields).forEach(([key, input]) => { input.value = savedProfile[key] || ''; });
      } catch (error) {
        detailsStatus.textContent = 'Tallennettuja tietoja ei voitu lukea.';
      }
      profileForm.addEventListener('submit', (event) => {
        event.preventDefault();
        if (!profileFields.email.value.trim() && !profileFields.phone.value.trim()) {
          detailsStatus.textContent = 'Lisää sähköposti tai puhelinnumero.';
          profileFields.email.focus();
          return;
        }
        const profile = Object.fromEntries(Object.entries(profileFields).map(([key, input]) => [key, input.value.trim()]));
        try {
          localStorage.setItem('opintoaikaProfile', JSON.stringify(profile));
          detailsStatus.textContent = 'Tiedot tallennettu tähän selaimeen.';
        } catch (error) {
          detailsStatus.textContent = 'Tietoja ei voitu tallentaa.';
        }
      });

      const photoInput = document.getElementById('profile-photo-input');
      const photoStatus = document.getElementById('photo-status');
      const photoKey = 'opintoaikaProfilePhoto';

      photoInput.addEventListener('change', () => {
        const file = photoInput.files && photoInput.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          photoStatus.textContent = 'Valitse kuvatiedosto.';
          photoInput.value = '';
          return;
        }
        const reader = new FileReader();
        reader.addEventListener('load', () => {
          const image = new Image();
          image.addEventListener('load', () => {
            const scale = Math.min(1, 320 / Math.max(image.naturalWidth, image.naturalHeight));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(image.naturalWidth * scale);
            canvas.height = Math.round(image.naturalHeight * scale);
            canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
            try {
              localStorage.setItem(photoKey, canvas.toDataURL('image/jpeg', 0.82));
              window.OpintoAikaSettings.refreshProfilePhoto();
              photoStatus.textContent = 'Profiilikuva tallennettu tähän selaimeen.';
            } catch (error) {
              photoStatus.textContent = 'Kuvaa ei voitu tallentaa. Valitse pienempi kuva.';
            }
          });
          image.addEventListener('error', () => { photoStatus.textContent = 'Kuvaa ei voitu avata.'; });
          image.src = String(reader.result);
        });
        reader.addEventListener('error', () => { photoStatus.textContent = 'Kuvaa ei voitu lukea.'; });
        reader.readAsDataURL(file);
      });

      document.getElementById('remove-profile-photo').addEventListener('click', () => {
        localStorage.removeItem(photoKey);
        window.OpintoAikaSettings.refreshProfilePhoto();
        photoStatus.textContent = 'Profiilikuva poistettu.';
      });
      document.getElementById('logout-link').addEventListener('click', () => {
  localStorage.removeItem('opintoaikaSession');
  window.location.href = './Kirjaudu.html';
      });
    })();
  </script>
</body>
</html>
